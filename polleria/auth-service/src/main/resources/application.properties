spring.application.name=auth-service
server.port=${PORT:8081}

# =====================
# Base de datos (AWS RDS PostgreSQL)
# =====================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================
# JWT
# =====================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# =====================
# Seguridad - Bloqueo de IP
# =====================
security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
security.block-duration-minutes=${BLOCK_DURATION_MINUTES:15}

# =====================
# 2FA - Spring Mail (Gmail SMTP)
# =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
security.two-factor.code-expiry-minutes=${TWO_FACTOR_EXPIRY_MINUTES:5}

# =====================
# CORS
# =====================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =====================
# Logs
# =====================
logging.level.com.sistema.polleria=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.profiles.active=local